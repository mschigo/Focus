<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus – Gantt Chart</title>
  <link rel="stylesheet" href="style.css?v=5" />
  
  <!-- Hammer.js (Zwingend erforderlich für Panning / Drag & Drop in Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  
  <!-- Chart.js, Date-Adapter & Zoom-Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

  <style>
    /* Grab-Cursor für intuitives Verschieben */
    #gantt-chart {
      cursor: grab;
      touch-action: pan-x;
    }
    #gantt-chart:active {
      cursor: grabbing;
    }

    /* Vollbild-Styling für den Card-Container */
    .card:fullscreen {
      background-color: var(--color-bg, #1e1e1e);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }
    .card:fullscreen .gantt-container {
      height: 85vh !important;
    }

    /* Auf dem Handy passt eine kleinere, feste Höhe deutlich besser als
       450px, die inline gesetzt sind – daher hier mit !important überschrieben. */
    @media (max-width: 600px) {
      .gantt-container {
        height: 300px !important;
      }
    }
  </style>
</head>
<body>

<div id="app-shell">
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo">F</span>
      <h1>Focus</h1>
    </div>
    <nav class="tabbar" id="tabbar">
      <a href="index.html" class="tab-btn" style="text-decoration: none;">🏠 Dashboard</a>
      <a href="zeitauswertung.html" class="tab-btn" style="text-decoration: none;">📊 Auswertung</a>
      <a href="gantt.html" class="tab-btn is-active" style="text-decoration: none;">📅 Gantt</a>
      <a href="index.html#einstellungen" class="tab-btn" style="text-decoration: none;">⚙️ Einstellungen</a>
    </nav>
  </header>

  <main id="app-main" style="padding: 20px; max-width: 1200px; margin: 0 auto;">
    
    <!-- Filterleiste & Steuerung -->
    <div class="filter-row" style="margin-bottom: 20px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;">
      <div class="filter-group">
        <label class="filter-group__label" for="filter-bereich">Bereich</label>
        <select id="filter-bereich" class="form-input" style="min-width: 160px;">
          <option value="Alle">Alle Bereiche</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-group__label" for="filter-projekt">Projekt</label>
        <select id="filter-projekt" class="form-input" style="min-width: 160px;">
          <option value="Alle">Alle Projekte</option>
        </select>
      </div>

      <div class="filter-group" style="margin-left: auto; display: flex; gap: 8px;">
        <button type="button" id="btn-reset-zoom" class="btn-secondary">🔄 Ansicht zurücksetzen</button>
        <button type="button" id="btn-fullscreen" class="btn-secondary">⛶ Vollbild</button>
      </div>
    </div>

    <!-- Gantt Chart Karte -->
    <div class="card" id="gantt-card" style="margin-bottom: 24px;">
      <h2 class="card-title">📅 Projekt-Timeline (Fälligkeiten & Zeiträume)</h2>
      <div class="gantt-container" style="position: relative; height: 450px; width: 100%;">
        <canvas id="gantt-chart"></canvas>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/store.js?v=7"></script>
<script>
let ganttChart = null;

function heuteIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function initGantt() {
  Store.onAuthChange((eingeloggt) => {
    if (eingeloggt) {
      initalisiereFilter();
      rendereGantt();
    } else {
      window.location.replace("index.html");
    }
  });

  try {
    await Store.starteAuthUeberwachung();
  } catch (err) {
    console.error("Fehler beim Start des Gantt Charts", err);
    window.location.replace("index.html");
  }

  document.getElementById("filter-bereich").addEventListener("change", (e) => {
    aktualisiereProjektDropdown(e.target.value);
    rendereGantt();
  });

  document.getElementById("filter-projekt").addEventListener("change", () => {
    rendereGantt();
  });

  document.getElementById("btn-reset-zoom").addEventListener("click", () => {
    if (ganttChart) {
      ganttChart.resetZoom();
    }
  });

  document.getElementById("btn-fullscreen").addEventListener("click", () => {
    const card = document.getElementById("gantt-card");
    if (!document.fullscreenElement) {
      if (card.requestFullscreen) {
        card.requestFullscreen();
      } else if (card.webkitRequestFullscreen) {
        card.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  });
}

function initalisiereFilter() {
  const bereichSelect = document.getElementById("filter-bereich");
  const bereiche = Store.getBereiche();

  bereichSelect.innerHTML = `<option value="Alle">Alle Bereiche</option>` +
    bereiche.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join("");

  aktualisiereProjektDropdown("Alle");
}

function aktualisiereProjektDropdown(bereich) {
  const projektSelect = document.getElementById("filter-projekt");
  const alteAuswahl = projektSelect.value;

  let projekte = [];
  if (bereich === "Alle") {
    projekte = Store.getProjekte();
  } else {
    projekte = Store.getProjekte(bereich);
  }

  projektSelect.innerHTML = `<option value="Alle">Alle Projekte</option>` +
    projekte.map(p => {
      const label = bereich === "Alle" ? `${p.Name} (${p.Bereich})` : p.Name;
      return `<option value="${escapeHtml(p.Id)}">${escapeHtml(label)}</option>`;
    }).join("");

  if ([...projektSelect.options].some(o => o.value === alteAuswahl)) {
    projektSelect.value = alteAuswahl;
  } else {
    projektSelect.value = "Alle";
  }
}

function holeGefilterteAufgaben() {
  const gewaehlterBereich = document.getElementById("filter-bereich").value;
  const gewaehltesProjekt = document.getElementById("filter-projekt").value;

  let aufgaben = Store.getAufgaben();

  if (gewaehlterBereich !== "Alle") {
    aufgaben = aufgaben.filter(a => (a.Bereich || "").toLowerCase() === gewaehlterBereich.toLowerCase());
  }

  if (gewaehltesProjekt !== "Alle") {
    aufgaben = aufgaben.filter(a => a.ProjektId === gewaehltesProjekt);
  }

  return aufgaben;
}

function formatiereDatumDE(dateStr) {
  if (!dateStr) return "-";
  const parts = dateStr.split("-");
  if (parts.length === 3) {
    return `${parts[2]}.${parts[1]}.${parts[0]}`;
  }
  return dateStr;
}

// Inline-Plugin für die heutige Trennlinie
const heuteLiniePlugin = {
  id: 'heuteLinie',
  afterDraw(chart) {
    const ctx = chart.ctx;
    const xAxi = chart.scales.x;
    const yAxis = chart.scales.y;

    const heuteStr = heuteIso();
    const xPixel = xAxi.getPixelForValue(new Date(heuteStr).getTime());

    if (xPixel >= xAxi.left && xPixel <= xAxi.right) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(xPixel, yAxis.top);
      ctx.lineTo(xPixel, yAxis.bottom);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ff4d4d';
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.restore();
    }
  }
};

function ermittleProjektFarbe(bereichName, projektName) {
  if (typeof Store === "undefined") return null;

  // Bereichsfarben liegen in der Datenbank (Store.getBereichFarbe), mit
  // Konto-übergreifender Synchronisation. Wir prüfen verschiedene
  // Schlüssel-Varianten (Bereich oder Projektname, Groß-/Kleinschreibung).
  const farbenMap = (Store._daten && Store._daten.Konfiguration && Store._daten.Konfiguration.BereichFarben) || {};

  for (const [key, val] of Object.entries(farbenMap)) {
    if (key.trim().toLowerCase() === (bereichName || "").trim().toLowerCase() ||
        key.trim().toLowerCase() === (projektName || "").trim().toLowerCase()) {
      return val;
    }
  }

  if (bereichName) {
    const bColor = Store.getBereichFarbe(bereichName);
    if (bColor) return bColor;
  }

  return null;
}

function rendereGantt() {
  const aufgaben = holeGefilterteAufgaben();
  const ctx = document.getElementById("gantt-chart").getContext("2d");

  if (ganttChart) ganttChart.destroy();

  const datumRegex = /^\d{4}-\d{2}-\d{2}$/;
  const aufgabenMitDatum = aufgaben.filter(a => a.Faelligkeit && datumRegex.test(a.Faelligkeit));

  if (aufgabenMitDatum.length === 0) {
    return;
  }

  const labels = [];
  const dataPoints = [];
  const backgroundColors = [];
  const originalData = [];

  let minDate = null;
  let maxDate = null;

  // Fallback-Farbpalette, falls absolut keine Farbe definiert ist
  const fallbackFarben = [
    "rgba(54, 162, 235, 0.7)",  
    "rgba(75, 192, 192, 0.7)",  
    "rgba(153, 102, 255, 0.7)", 
    "rgba(255, 159, 64, 0.7)"   
  ];
  let fallbackIndex = 0;

  aufgabenMitDatum.forEach(a => {
    const titel = a.Titel;
    const faellig = a.Faelligkeit;
    
    let start = a.Startdatum && datumRegex.test(a.Startdatum) ? a.Startdatum : null;

    if (!start && a.ErstelltAm && datumRegex.test(a.ErstelltAm.substring(0, 10))) {
      const ers = a.ErstelltAm.substring(0, 10);
      if (ers <= faellig) {
        start = ers;
      }
    }

    if (!start || start >= faellig) {
      const d = new Date(faellig);
      d.setDate(d.getDate() - 1);
      start = d.toISOString().substring(0, 10);
    }

    labels.push(titel);
    dataPoints.push([start, faellig]);
    originalData.push({
      start,
      faellig,
      titel,
      projekt: a.ProjektName ? `${a.ProjektName} (${a.Bereich})` : "Ohne Projekt"
    });

    if (!minDate || start < minDate) minDate = start;
    if (!maxDate || faellig > maxDate) maxDate = faellig;

    // Farbzuweisung aus den Dashboard-Einstellungen (Bereich / Projekt)
    let farbe = ermittleProjektFarbe(a.Bereich, a.ProjektName);

    if (!farbe) {
      farbe = fallbackFarben[fallbackIndex % fallbackFarben.length];
      fallbackIndex++;
    }

    backgroundColors.push(farbe);
  });

  ganttChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        label: "Zeitraum",
        data: dataPoints,
        backgroundColor: backgroundColors,
        borderRadius: 4,
        borderSkipped: false
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: "time",
          min: minDate,
          max: maxDate,
          time: {
            unit: "day",
            displayFormats: { day: "dd.MM.yyyy" }
          },
          title: { display: true, text: "Datum" }
        },
        y: {
          title: { display: true, text: "Aufgaben" }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(context) {
              const idx = context.dataIndex;
              const item = originalData[idx];
              if (!item) return "";
              return [
                `Projekt: ${item.projekt || "-"}`,
                `Start: ${formatiereDatumDE(item.start)}`,
                `Fällig: ${formatiereDatumDE(item.faellig)}`
              ];
            }
          }
        },
        zoom: {
          pan: {
            enabled: true,
            mode: "x"
          },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: "x"
          }
        }
      }
    },
    plugins: [heuteLiniePlugin]
  });
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text ?? "";
  return div.innerHTML;
}

document.addEventListener("DOMContentLoaded", initGantt);
</script>

</body>
</html>
