<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus – Zeitauswertung</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="app-shell">
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo">F</span>
      <h1>Focus – Zeitauswertung</h1>
    </div>
    <nav class="tabbar" id="tabbar">
      <a href="index.html" class="tab-btn" style="text-decoration: none;">← Zurück zum Dashboard</a>
    </nav>
  </header>

  <main id="app-main" style="padding: 20px; max-width: 1200px; margin: 0 auto;">
    
    <!-- Filterleiste: Bereich & Projekt -->
    <div class="filter-row" style="margin-bottom: 20px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
      <div class="filter-group">
        <label class="filter-group__label" for="filter-bereich">Bereich</label>
        <select id="filter-bereich" class="form-input" style="min-width: 180px;">
          <option value="Alle">Alle Bereiche</option>
        </select>
      </div>
      <div class="filter-group">
        <label class="filter-group__label" for="filter-projekt">Projekt</label>
        <select id="filter-projekt" class="form-input" style="min-width: 180px;">
          <option value="Alle">Alle Projekte</option>
        </select>
      </div>
    </div>

    <!-- KPI Übersicht -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
      <div class="kpi-card">
        <div class="kpi-card__value" id="kpi-soll">0.0h</div>
        <div class="kpi-card__label">Gesamt Soll-Zeit</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card__value" id="kpi-ist">0.0h</div>
        <div class="kpi-card__label">Gesamt Ist-Zeit</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card__value" id="kpi-diff">0.0h</div>
        <div class="kpi-card__label">Differenz (Ist - Soll)</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-card__value" id="kpi-anzahl">0</div>
        <div class="kpi-card__label">Ausgewertete Aufgaben</div>
      </div>
    </div>

    <!-- Diagramme -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 24px;">
      <div class="card">
        <h2 class="card-title">Soll vs. Ist nach Projekt</h2>
        <div style="position: relative; height: 300px;">
          <canvas id="chart-projekte"></canvas>
        </div>
      </div>
      <div class="card">
        <h2 class="card-title">Aufwandsverteilung (Ist-Zeit)</h2>
        <div style="position: relative; height: 300px;">
          <canvas id="chart-verteilung"></canvas>
        </div>
      </div>
    </div>

    <!-- Top Abweichungen -->
    <div class="card">
      <h2 class="card-title">Grösste Aufwandsabweichungen</h2>
      <div id="tabelle-abweichungen"></div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/store.js"></script>
<script>
let barChart = null;
let pieChart = null;

async function initAuswertung() {
  Store.onAuthChange((eingeloggt) => {
    if (eingeloggt) {
      initalisiereFilter();
      rendereAuswertung();
    }
  });

  try {
    await Store.starteAuthUeberwachung();
  } catch (err) {
    console.error("Fehler beim Start der Auswertung", err);
  }

  document.getElementById("filter-bereich").addEventListener("change", (e) => {
    aktualisiereProjektDropdown(e.target.value);
    rendereAuswertung();
  });

  document.getElementById("filter-projekt").addEventListener("change", () => {
    rendereAuswertung();
  });
}

function initalisiereFilter() {
  const bereichSelect = document.getElementById("filter-bereich");
  const bereiche = Store.getBereiche();

  bereichSelect.innerHTML = `<option value="Alle">Alle Bereiche</option>` +
    bereiche.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join("");

  aktualisiereProjektDropdown("Alle");
}

function aktualisiereProjektDropdown(bereich) {
  const projektSelect = document.getElementById("filter-projekt");
  const alteAuswahl = projektSelect.value;

  let projekte = [];
  if (bereich === "Alle") {
    projekte = Store.getProjekte();
  } else {
    projekte = Store.getProjekte(bereich);
  }

  projektSelect.innerHTML = `<option value="Alle">Alle Projekte</option>` +
    projekte.map(p => `<option value="${escapeHtml(p.Name)}">${escapeHtml(p.Name)}</option>`).join("");

  if ([...projektSelect.options].some(o => o.value === alteAuswahl)) {
    projektSelect.value = alteAuswahl;
  } else {
    projektSelect.value = "Alle";
  }
}

function holeGefilterteAufgaben() {
  const gewaehlterBereich = document.getElementById("filter-bereich").value;
  const gewaehltesProjekt = document.getElementById("filter-projekt").value;
  let aufgaben = Store.getAufgaben();

  if (gewaehlterBereich !== "Alle") {
    aufgaben = aufgaben.filter(a => (a.Bereich || "").toLowerCase() === gewaehlterBereich.toLowerCase());
  }

  if (gewaehltesProjekt !== "Alle") {
    aufgaben = aufgaben.filter(a => (a.ProjektName || "").toLowerCase() === gewaehltesProjekt.toLowerCase());
  }

  return aufgaben;
}

function rendereAuswertung() {
  const aufgaben = holeGefilterteAufgaben();

  let totalSoll = 0;
  let totalIst = 0;
  let anzahl = 0;

  const projektStats = {};

  aufgaben.forEach(a => {
    const soll = parseFloat(a.SollZeit) || 0;
    const ist = parseFloat(a.IstZeit) || 0;

    if (soll > 0 || ist > 0) {
      anzahl++;
      totalSoll += soll;
      totalIst += ist;

      const pName = a.ProjektName || "Ohne Projekt";
      if (!projektStats[pName]) {
        projektStats[pName] = { soll: 0, ist: 0 };
      }
      projektStats[pName].soll += soll;
      projektStats[pName].ist += ist;
    }
  });

  const diff = totalIst - totalSoll;
  document.getElementById("kpi-soll").textContent = `${totalSoll.toFixed(1)}h`;
  document.getElementById("kpi-ist").textContent = `${totalIst.toFixed(1)}h`;
  
  const diffEl = document.getElementById("kpi-diff");
  diffEl.textContent = `${diff >= 0 ? "+" : ""}${diff.toFixed(1)}h`;
  diffEl.style.color = diff > 0 ? "var(--color-p1)" : (diff < 0 ? "#2e7d32" : "inherit");

  document.getElementById("kpi-anzahl").textContent = anzahl;

  rendereBalkenDiagramm(projektStats);
  rendereKuchenDiagramm(projektStats);
  rendereTabelle(aufgaben);
}

function rendereBalkenDiagramm(projektStats) {
  const labels = Object.keys(projektStats);
  const sollData = labels.map(l => projektStats[l].soll);
  const istData = labels.map(l => projektStats[l].ist);

  const ctx = document.getElementById("chart-projekte").getContext("2d");
  if (barChart) barChart.destroy();

  barChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [
        { label: "Soll (h)", data: sollData, backgroundColor: "rgba(54, 162, 235, 0.6)" },
        { label: "Ist (h)", data: istData, backgroundColor: "rgba(255, 99, 132, 0.6)" }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: { y: { beginAtZero: true } }
    }
  });
}

function rendereKuchenDiagramm(projektStats) {
  const labels = Object.keys(projektStats);
  const istData = labels.map(l => projektStats[l].ist);

  const ctx = document.getElementById("chart-verteilung").getContext("2d");
  if (pieChart) pieChart.destroy();

  pieChart = new Chart(ctx, {
    type: "doughnut",
    data: {
      labels: labels,
      datasets: [{
        data: istData,
        backgroundColor: [
          "#4bc0c0", "#ff6384", "#36a2eb", "#ffce56", "#9966ff", "#ff9f40"
        ]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
}

function rendereTabelle(aufgaben) {
  const container = document.getElementById("tabelle-abweichungen");
  
  const abweichungen = aufgaben
    .map(a => {
      const soll = parseFloat(a.SollZeit) || 0;
      const ist = parseFloat(a.IstZeit) || 0;
      return { ...a, soll, ist, diff: ist - soll };
    })
    .filter(a => a.soll > 0 || a.ist > 0)
    .sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));

  if (abweichungen.length === 0) {
    container.innerHTML = `<p style="color: var(--color-text-muted); font-size: 13px;">Keine Aufgaben mit Zeiterfassung vorhanden.</p>`;
    return;
  }

  let html = `
    <table style="width: 100%; border-collapse: collapse; font-size: 14px; text-align: left;">
      <thead>
        <tr style="border-bottom: 1px solid var(--color-border, #ccc); padding-bottom: 8px;">
          <th style="padding: 8px;">Titel</th>
          <th style="padding: 8px;">Projekt</th>
          <th style="padding: 8px;">Soll</th>
          <th style="padding: 8px;">Ist</th>
          <th style="padding: 8px;">Abweichung</th>
        </tr>
      </thead>
      <tbody>
  `;

  abweichungen.forEach(a => {
    const diffText = `${a.diff >= 0 ? "+" : ""}${a.diff.toFixed(1)}h`;
    const diffColor = a.diff > 0 ? "var(--color-p1)" : (a.diff < 0 ? "#2e7d32" : "inherit");

    html += `
      <tr style="border-bottom: 1px solid var(--color-border, #eee);">
        <td style="padding: 8px;">${escapeHtml(a.Titel)}</td>
        <td style="padding: 8px; color: var(--color-text-muted);">${escapeHtml(a.ProjektName || "-")}</td>
        <td style="padding: 8px;">${a.soll.toFixed(1)}h</td>
        <td style="padding: 8px;">${a.ist.toFixed(1)}h</td>
        <td style="padding: 8px; font-weight: bold; color: ${diffColor};">${diffText}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  container.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text ?? "";
  return div.innerHTML;
}

document.addEventListener("DOMContentLoaded", initAuswertung);
</script>

</body>
</html>
